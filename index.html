<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiplying Fractions Quiz</title><style>body{font-family:system-ui,Arial;background:#f2f5fa;color:#152438;margin:0}main{max-width:760px;margin:24px auto;padding:22px;background:white;border-radius:14px;box-shadow:0 4px 24px #20305020}h1{color:#163b70}button{padding:12px;border:1px solid #9fb1c9;border-radius:9px;background:#fff;cursor:pointer;text-align:left;font-size:16px}button:hover{background:#eaf2ff}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.question{padding:16px 0;border-bottom:1px solid #ddd}.feedback{font-weight:600;margin-top:8px}.correct{color:#17633d}.wrong{color:#a02626}#score{font-weight:700}#reset{background:#173d70;color:white;margin-top:15px}small{color:#50637a}@media(max-width:500px){.choices{grid-template-columns:1fr}}</style><main><h1>Multiplying Fractions</h1><p>Mathematics 700 Fundamentals • Unit 2</p><p>Choose an answer to get immediate feedback. Questions and answer choices shuffle on each attempt.</p><p id="score"></p><div id="quiz"></div><button id="reset">Start New Attempt</button><p><small>Works offline in Chrome, including on Chromebooks.</small></p></main><script>const bank=[{"n": 1, "q": "1/3 \u00d7 2/5", "choices": ["2/15", "1/8", "1/4", "1/5"], "answer": 0, "solution": "Multiply numerators and denominators: (1\u00d72)/(3\u00d75) = 2/15 = 2/15.", "value": "2/15"}, {"n": 2, "q": "3/4 \u00d7 2/7", "choices": ["3/14", "2/7", "1/3", "1/5"], "answer": 0, "solution": "Multiply numerators and denominators: (3\u00d72)/(4\u00d77) = 6/28 = 3/14.", "value": "3/14"}, {"n": 3, "q": "5/6 \u00d7 3/10", "choices": ["1/5", "1/2", "1/4", "3/5"], "answer": 2, "solution": "Multiply numerators and denominators: (5\u00d73)/(6\u00d710) = 15/60 = 1/4.", "value": "1/4"}, {"n": 4, "q": "4/9 \u00d7 3/8", "choices": ["1/6", "3/7", "1/7", "1/3"], "answer": 0, "solution": "Multiply numerators and denominators: (4\u00d73)/(9\u00d78) = 12/72 = 1/6.", "value": "1/6"}, {"n": 5, "q": "7/12 \u00d7 6/7", "choices": ["1", "1/3", "1/2", "2"], "answer": 2, "solution": "Multiply numerators and denominators: (7\u00d76)/(12\u00d77) = 42/84 = 1/2.", "value": "1/2"}, {"n": 6, "q": "2/5 \u00d7 15/4", "choices": ["1", "1 2/3", "1 1/2", "2"], "answer": 2, "solution": "Multiply numerators and denominators: (2\u00d715)/(5\u00d74) = 30/20 = 3/2.", "value": "1 1/2"}, {"n": 7, "q": "3/8 \u00d7 4/9", "choices": ["1/7", "1/6", "3/7", "1/3"], "answer": 1, "solution": "Multiply numerators and denominators: (3\u00d74)/(8\u00d79) = 12/72 = 1/6.", "value": "1/6"}, {"n": 8, "q": "5/12 \u00d7 9/10", "choices": ["1/3", "3/8", "5/9", "1/2"], "answer": 1, "solution": "Multiply numerators and denominators: (5\u00d79)/(12\u00d710) = 45/120 = 3/8.", "value": "3/8"}, {"n": 9, "q": "7/9 \u00d7 3/14", "choices": ["3/7", "1/7", "1/6", "1/3"], "answer": 2, "solution": "Multiply numerators and denominators: (7\u00d73)/(9\u00d714) = 21/126 = 1/6.", "value": "1/6"}, {"n": 10, "q": "2/3 \u00d7 9/16", "choices": ["5/9", "1/2", "1/3", "3/8"], "answer": 3, "solution": "Multiply numerators and denominators: (2\u00d79)/(3\u00d716) = 18/48 = 3/8.", "value": "3/8"}, {"n": 11, "q": "4/5 \u00d7 5/12", "choices": ["1/3", "1/4", "2/3", "3/4"], "answer": 0, "solution": "Multiply numerators and denominators: (4\u00d75)/(5\u00d712) = 20/60 = 1/3.", "value": "1/3"}, {"n": 12, "q": "11/15 \u00d7 5/22", "choices": ["1/7", "1/6", "1/3", "3/7"], "answer": 1, "solution": "Multiply numerators and denominators: (11\u00d75)/(15\u00d722) = 55/330 = 1/6.", "value": "1/6"}, {"n": 13, "q": "3/7 \u00d7 14/15", "choices": ["2/3", "3/5", "1/3", "2/5"], "answer": 3, "solution": "Multiply numerators and denominators: (3\u00d714)/(7\u00d715) = 42/105 = 2/5.", "value": "2/5"}, {"n": 14, "q": "5/8 \u00d7 16/25", "choices": ["3/5", "2/3", "1/3", "2/5"], "answer": 3, "solution": "Multiply numerators and denominators: (5\u00d716)/(8\u00d725) = 80/200 = 2/5.", "value": "2/5"}, {"n": 15, "q": "9/10 \u00d7 5/6", "choices": ["3/5", "3/4", "1 1/3", "1"], "answer": 1, "solution": "Multiply numerators and denominators: (9\u00d75)/(10\u00d76) = 45/60 = 3/4.", "value": "3/4"}, {"n": 16, "q": "7/16 \u00d7 8/21", "choices": ["1/7", "1/3", "3/7", "1/6"], "answer": 3, "solution": "Multiply numerators and denominators: (7\u00d78)/(16\u00d721) = 56/336 = 1/6.", "value": "1/6"}, {"n": 17, "q": "2/7 \u00d7 14", "choices": ["4", "3", "5", "2"], "answer": 0, "solution": "Write 14 as 14/1. Multiply: 28/7 = 4.", "value": "4"}, {"n": 18, "q": "3/8 \u00d7 12", "choices": ["5", "4 1/2", "3", "3 2/3"], "answer": 1, "solution": "Write 12 as 12/1. Multiply: 36/8 = 9/2.", "value": "4 1/2"}, {"n": 19, "q": "5/9 \u00d7 6", "choices": ["3", "3 2/3", "3 1/3", "2 1/2"], "answer": 2, "solution": "Write 6 as 6/1. Multiply: 30/9 = 10/3.", "value": "3 1/3"}, {"n": 20, "q": "7/10 \u00d7 15", "choices": ["7", "7 2/3", "11", "10 1/2"], "answer": 3, "solution": "Write 15 as 15/1. Multiply: 105/10 = 21/2.", "value": "10 1/2"}, {"n": 21, "q": "1 1/2 \u00d7 2 1/3", "choices": ["2 1/3", "3 1/2", "3", "4"], "answer": 1, "solution": "Convert to improper fractions: 3/2 \u00d7 7/3 = 7/2.", "value": "3 1/2"}, {"n": 22, "q": "2 1/4 \u00d7 1 1/2", "choices": ["3 1/2", "3 2/9", "3", "3 3/8"], "answer": 3, "solution": "Convert to improper fractions: 9/4 \u00d7 3/2 = 27/8.", "value": "3 3/8"}, {"n": 23, "q": "1 2/3 \u00d7 3 1/2", "choices": ["6", "5 2/7", "5 5/6", "5"], "answer": 2, "solution": "Convert to improper fractions: 5/3 \u00d7 7/2 = 35/6.", "value": "5 5/6"}, {"n": 24, "q": "2 2/5 \u00d7 1 1/4", "choices": ["3", "1 1/2", "4", "2 1/2"], "answer": 0, "solution": "Convert to improper fractions: 12/5 \u00d7 5/4 = 3.", "value": "3"}];let answered=0,correct=0;const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function start(){answered=correct=0;let q=document.getElementById('quiz');q.innerHTML='';shuffle([...bank]).forEach((it,index)=>{let section=document.createElement('section');section.className='question';let h=document.createElement('h3');h.textContent=(index+1)+'. '+it.q;section.appendChild(h);let choices=document.createElement('div');choices.className='choices';let fb=document.createElement('p');fb.className='feedback';let options=shuffle(it.choices.map((label,j)=>({label,good:j===it.answer})));options.forEach((opt,j)=>{let b=document.createElement('button');b.textContent='ABCD'[j]+'. '+opt.label;b.onclick=()=>{if(section.dataset.done)return;section.dataset.done='1';answered++;if(opt.good)correct++;fb.className='feedback '+(opt.good?'correct':'wrong');fb.textContent=(opt.good?'Correct! ':'Not quite. Correct answer: '+it.value+'. ')+it.solution;choices.querySelectorAll('button').forEach(x=>x.disabled=true);score()};choices.appendChild(b)});section.appendChild(choices);section.appendChild(fb);q.appendChild(section)});score()}function score(){document.getElementById('score').textContent='Score: '+correct+' / '+answered+' answered ('+bank.length+' questions total)'}document.getElementById('reset').onclick=start;start();</script></html>
